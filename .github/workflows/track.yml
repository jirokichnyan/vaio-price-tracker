name: VAIO Price Tracker

on:
  schedule:
    # 毎日 07:00 JST (UTC 22:00 前日) に実行
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python collector.py

      - name: Commit updated data
        run: |
          git config user.name "vaio-price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/price_history.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update price history $(date -u +%Y-%m-%d)"
          git push
